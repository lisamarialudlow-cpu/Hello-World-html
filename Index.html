
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #222;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
    }
    main {
      text-align: center;
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 18px #0001;
    }
    h1 { color: #2563eb; }
    button {
      padding: 0.7rem 1rem;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    <h1 id="greeting">Hello, World!</h1>
    <p>Welcome to my first webpage.</p>
    <button id="changeButton">Click me</button>
  </main>
  <script>
    const greeting = document.getElementById("greeting");
    const button = document.getElementById("changeButton");

    button.addEventListener("click", () => {
      greeting.textContent = greeting.textContent === "Hello, World!"
        ? "Hello there!"
        : "Hello, World!";
    });
  </script>
</body>
</html>
